spring.application.name=javastorm-shop
server.port=${PORT:8080}

# 数据库：默认使用本地文件型 H2（./data/shop.mv.db），无需安装数据库即可运行。
# 生产环境可换成 MySQL/PostgreSQL，只需修改下面三项并添加对应驱动依赖。
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shop;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 商品图片上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
shop.upload-dir=${UPLOAD_DIR:./uploads}

# 后台管理员账号（上线前务必通过环境变量修改密码）
shop.admin.username=${ADMIN_USERNAME:admin}
shop.admin.password=${ADMIN_PASSWORD:admin123}

# 空数据库首次启动时写入示例商品
shop.demo-data=${DEMO_DATA:true}

spring.thymeleaf.cache=false
