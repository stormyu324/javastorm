<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? '添加商品' : '编辑商品')}"></head>
<body>
<header th:replace="~{fragments/layout :: adminHeader('products')}"></header>
<main class="container" style="max-width:900px">
    <p><a th:href="@{/admin/products}">← 返回商品列表</a></p>
    <h1 th:text="${form.id == null} ? '添加商品' : '编辑商品'">添加商品</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/admin/products/save}" th:object="${form}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">

        <div class="card">
            <h2>基本信息</h2>
            <div class="field">
                <label for="name">商品名称 *</label>
                <input id="name" th:field="*{name}" required maxlength="200" placeholder="例如：纯棉圆领T恤 白色 M码">
                <div class="err" th:errors="*{name}"></div>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="categoryId">分类</label>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option value="">未分类</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="hint">没有合适的分类？<a th:href="@{/admin/categories}" target="_blank">去添加</a></div>
                </div>
                <div class="field">
                    <label for="sku">SKU / 商品编码</label>
                    <input id="sku" th:field="*{sku}" maxlength="64" placeholder="留空自动生成">
                    <div class="err" th:errors="*{sku}"></div>
                </div>
            </div>
            <div class="grid-3">
                <div class="field">
                    <label for="price">售价（元）*</label>
                    <input id="price" th:field="*{price}" type="number" step="0.01" min="0" required>
                    <div class="err" th:errors="*{price}"></div>
                </div>
                <div class="field">
                    <label for="originalPrice">原价（元）</label>
                    <input id="originalPrice" th:field="*{originalPrice}" type="number" step="0.01" min="0" placeholder="可选，显示为划线价">
                    <div class="err" th:errors="*{originalPrice}"></div>
                </div>
                <div class="field">
                    <label for="stock">库存 *</label>
                    <input id="stock" th:field="*{stock}" type="number" min="0" required>
                    <div class="err" th:errors="*{stock}"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>商品图片</h2>
            <label class="dropzone" id="dropzone">
                <input type="file" id="images" name="images" accept="image/*" multiple>
                <strong>点击选择图片，或把图片拖到这里</strong>
                <div class="muted">可一次选多张，支持 jpg / png / gif / webp，单张不超过 10MB</div>
            </label>
            <div class="previews" id="newPreviews"></div>

            <div class="field" style="margin-top:16px">
                <label for="imageUrlsText">图片地址（每行一个，第一张为主图）</label>
                <textarea id="imageUrlsText" th:field="*{imageUrlsText}" rows="3" placeholder="也可以直接粘贴网络图片地址，例如 https://example.com/a.jpg"></textarea>
                <div class="hint">已上传的图片也列在这里：调整行的顺序可以更换主图，删掉某一行即可移除该图片。新上传的图片会排在最后。</div>
            </div>
            <div class="previews" id="urlPreviews"></div>
        </div>

        <div class="card">
            <h2>商品描述</h2>
            <textarea th:field="*{description}" rows="8" maxlength="10000" placeholder="材质、尺寸、规格、使用说明等"></textarea>
            <div class="err" th:errors="*{description}"></div>
        </div>

        <div class="card">
            <div class="field">
                <label>保存后的状态</label>
                <label th:each="s : ${statuses}" style="display:inline-block;font-weight:400;margin-right:18px">
                    <input type="radio" th:field="*{status}" th:value="${s}"> <span th:text="${s.label}"></span>
                </label>
                <div class="hint">“上架”后顾客立刻就能在商城看到并购买；“草稿”仅保存，不展示。</div>
            </div>
            <div class="actions">
                <button type="submit">保存</button>
                <button type="submit" name="next" value="new" class="ghost" th:if="${form.id == null}">保存并继续添加</button>
                <a th:href="@{/admin/products}" class="btn ghost">取消</a>
            </div>
        </div>
    </form>
</main>
<script>
    (function () {
        var input = document.getElementById('images');
        var zone = document.getElementById('dropzone');
        var newPreviews = document.getElementById('newPreviews');
        var urls = document.getElementById('imageUrlsText');
        var urlPreviews = document.getElementById('urlPreviews');

        function showFiles() {
            newPreviews.innerHTML = '';
            Array.prototype.forEach.call(input.files, function (file) {
                var fig = document.createElement('figure');
                var img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                var cap = document.createElement('figcaption');
                cap.textContent = '待上传';
                fig.appendChild(img);
                fig.appendChild(cap);
                newPreviews.appendChild(fig);
            });
        }

        function showUrls() {
            urlPreviews.innerHTML = '';
            urls.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (u, i) {
                var fig = document.createElement('figure');
                var img = document.createElement('img');
                img.src = u;
                var cap = document.createElement('figcaption');
                cap.textContent = i === 0 ? '主图' : '第 ' + (i + 1) + ' 张';
                fig.appendChild(img);
                fig.appendChild(cap);
                urlPreviews.appendChild(fig);
            });
        }

        input.addEventListener('change', showFiles);
        urls.addEventListener('input', showUrls);
        ['dragenter', 'dragover'].forEach(function (e) {
            zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.add('drag'); });
        });
        ['dragleave', 'drop'].forEach(function (e) {
            zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.remove('drag'); });
        });
        zone.addEventListener('drop', function (ev) {
            if (ev.dataTransfer && ev.dataTransfer.files.length) {
                input.files = ev.dataTransfer.files;
                showFiles();
            }
        });
        showUrls();
    })();
</script>
</body>
</html>
