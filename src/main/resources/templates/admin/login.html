<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('后台登录')}"></head>
<body>
<main class="login-wrap">
    <form class="card login-card" th:action="@{/admin/login}" method="post">
        <span class="brand"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.5L9 22l10-12h-6.6L13.5 2z"/></svg></span><span>Storm<span class="accent">商城</span></span><span class="console">ADMIN</span></span>
        <h1>登录管理后台</h1>
        <div class="alert error" th:if="${param.error}">用户名或密码错误</div>
        <div class="alert success" th:if="${param.logout}">已退出登录</div>
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" style="width:100%">登录</button>
        <p class="center"><a th:href="@{/}">返回商城</a></p>
    </form>
</main>
</body>
</html>
