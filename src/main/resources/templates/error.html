<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面出错 - Storm 商城</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <div class="card center">
        <h1 th:text="${status == 404} ? '页面不存在' : '出错了'">出错了</h1>
        <p th:if="${status == 404}">商品可能已下架或链接有误。</p>
        <p th:unless="${status == 404}">服务器暂时无法处理请求，请稍后再试。</p>
        <p><a th:href="@{/}" class="btn">回到首页</a></p>
    </div>
</main>
</body>
</html>
